<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Clone Spotify</title>
	<link rel="stylesheet" href="styles.css">
	<script src="app.js" defer></script>

	<!-- FONTES -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

	<!-- ICONES -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">

</head>
<body>
	<header>
        <div class="header-controls">
            <button type="button" aria-label="Mais opções"><span class="mdi mdi-dots-horizontal" aria-hidden="true"></span></button>
            <button type="button" aria-label="Voltar"><img class="header-control__icon" src="https://img.icons8.com/?size=100&amp;id=91482&amp;format=png&amp;color=000000" alt="" aria-hidden="true"></button>
            <button type="button" aria-label="Avançar"><img class="header-control__icon" src="https://img.icons8.com/?size=100&amp;id=91474&amp;format=png&amp;color=000000" alt="" aria-hidden="true"></button>
        </div>
        <div class="header-search">
            <button type="button" aria-label="Início"><span class="mdi mdi-home outline" aria-hidden="true"></span></button>
            <label for="input-search"><span class="mdi mdi-magnify" aria-hidden="true"></span></label>
            <input type="text" id="input-search" aria-label="Buscar">
        </div>
        <div class="header-menu">
            <button type="button" aria-label="Notificações"><span class="mdi mdi-bell" aria-hidden="true"></span></button>
            <button type="button" aria-label="Comunidade"><span class="mdi mdi-account-group" aria-hidden="true"></span></button>
            <button type="button" aria-label="Conta">R</button>
        </div>
    </header>

	<main></main>

	<footer class="music-player">
        <!-- O seletor aceita formatos de áudio; o navegador determina quais consegue decodificar. -->
        <input class="music-player__file-input" id="audio-file" type="file" accept="audio/*,video/mp4,.flac,.wma,.aiff,.alac">
        <audio class="music-player__audio" preload="metadata"></audio>
        <div class="Play-music">
            <button class="Pplay-music__cover" type="button" aria-label="Carregar arquivo de música" title="Carregar arquivo de música">
                <span class="mdi mdi-music" aria-hidden="true"></span>
            </button>
            <div class="Pplay-music__info">
                <h2 class="Pplay-music__title">Nenhuma música selecionada</h2>
                <p class="Pplay-music__artist">Carregue um arquivo de áudio</p>
                <span class="music-player__status" role="status" aria-live="polite"></span>
            </div>
            <button class="music-player__add" type="button" aria-label="Adicionar à biblioteca">
                <span class="mdi mdi-plus-circle-outline" aria-hidden="true"></span>
            </button>
        </div>
        <div class="music-player__center">
            <div class="music-player__controls">
                <button class="music-player__secondary" type="button" aria-label="Reprodução aleatória">
                    <span class="mdi mdi-shuffle" aria-hidden="true"></span>
                </button>
                <button class="music-player__track music-player__previous" type="button" aria-label="Anterior">
                    <img class="music-player__track-icon" src="https://img.icons8.com/?size=100&amp;id=91482&amp;format=png&amp;color=000000" alt="" aria-hidden="true">
                </button>
                <button class="music-player__play" type="button" aria-label="Reproduzir" aria-pressed="false" disabled>
                    <img class="music-player__play-icon" src="https://img.icons8.com/?size=100&amp;id=59862&amp;format=png&amp;color=000000" alt="" aria-hidden="true">
                </button>
                <button class="music-player__track music-player__next" type="button" aria-label="Avançar">
                    <img class="music-player__track-icon" src="https://img.icons8.com/?size=100&amp;id=91474&amp;format=png&amp;color=000000" alt="" aria-hidden="true">
                </button>
                <button class="music-player__secondary" type="button" aria-label="Repetir">
                    <span class="mdi mdi-repeat" aria-hidden="true"></span>
                </button>
            </div>
            <div class="music-player__timeline">
                <span class="music-player__time music-player__current-time">0:00</span>
                <input class="music-player__progress" type="range" min="0" max="0" step="0.1" value="0" aria-label="Progresso da música" disabled>
                <span class="music-player__time music-player__duration">0:00</span>
            </div>
        </div>
        <div class="music-player__extras">
            <button type="button" aria-label="Letra"><span class="mdi mdi-microphone-outline" aria-hidden="true"></span></button>
            <button type="button" aria-label="Fila"><span class="mdi mdi-playlist-music" aria-hidden="true"></span></button>
            <button type="button" aria-label="Conectar a um dispositivo"><span class="mdi mdi-speaker" aria-hidden="true"></span></button>
            <div class="music-player__volume" aria-label="Volume">
                <button class="music-player__mute" type="button" aria-label="Silenciar">
                    <span class="mdi mdi-volume-high" aria-hidden="true"></span>
                </button>
                <input class="music-player__volume-control" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Volume" aria-valuetext="75%">
            </div>
            <button type="button" aria-label="Mini player"><span class="mdi mdi-picture-in-picture-bottom-right" aria-hidden="true"></span></button>
            <button type="button" aria-label="Tela cheia"><span class="mdi mdi-fullscreen" aria-hidden="true"></span></button>
        </div>
	</footer>
</body>
</html>
